/* ===== ARMAZENAMENTO (IndexedDB do navegador) ===== */
let S = null;
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/\s+/g, " ").trim();

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("trajesDB", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function loadState() {
  try {
    const db = await openDB();
    return await new Promise(res => {
      const q = db.transaction("kv").objectStore("kv").get("state");
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => res(null);
    });
  } catch (e) { return null; }
}
let saveT;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    try {
      const db = await openDB();
      const tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").put(S, "state");
      tx.oncomplete = () => toast("Salvo ✓");
      tx.onerror = () => toast("Erro ao salvar!");
    } catch (e) { toast("Erro ao salvar!"); }
  }, 400);
}
function seedState() {
  return {
    version: 3, common: [],
    costumes: SEED_T.map(([name, items]) => ({
      id: uid(), name, photo: "",
      items: items.map(([part, type, color, qty, notes]) => ({ id: uid(), part, type, color, qty, notes, photo: "" }))
    })),
    dances: SEED_DANCES.slice(),
    dancers: SEED_DANCERS.map(n => ({ id: uid(), name: n, nums: {} }))
  };
}

/* ===== UTILITÁRIOS ===== */
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 1200); }
function go(h) { location.hash = h; }
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const today = () => new Date().toISOString().slice(0, 10);
function readImg(file, max = 900) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
        cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
        res(cv.toDataURL("image/jpeg", 0.82));
      };
      im.onerror = rej; im.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function pickImg(cb) {
  const i = document.createElement("input");
  i.type = "file"; i.accept = "image/*";
  i.onchange = async () => { if (i.files[0]) cb(await readImg(i.files[0])); };
  i.click();
}
/* Lightbox da foto */
function openPhoto(src, onChange, onDelete) {
  const lb = document.getElementById("lb");
  document.getElementById("lbimg").src = src;
  lb.style.display = "flex";
  document.getElementById("lbchg").onclick = () => { lb.style.display = "none"; pickImg(onChange); };
  document.getElementById("lbdel").onclick = () => { lb.style.display = "none"; onDelete(); };
  document.getElementById("lbclose").onclick = () => lb.style.display = "none";
}
document.getElementById("lb").addEventListener("click", e => { if (e.target.id === "lb") e.currentTarget.style.display = "none"; });

function findCostume(dance) {
  const n = norm(ALIAS[dance] || dance);
  return S.costumes.find(c => norm(c.name) === n) || S.costumes.find(c => norm(c.name).startsWith(n + " "));
}
/* ===== PEÇAS COMUNS ===== */
/* Uma peça comum é cadastrada uma única vez (dados + foto) e vinculada aos trajes escolhidos.
   No traje, a linha vinculada guarda só { id, cid } e mostra os dados da peça comum. */
const commonOf = it => it.cid ? S.common.find(x => x.id === it.cid) : null;
const eff = it => commonOf(it) || it;
const costumesOf = cm => S.costumes.filter(c => c.items.some(i => i.cid === cm.id));
function cmLabel(cm) { return [cm.part, cm.type, cm.color].filter(Boolean).join(" · "); }
function ask(msg, opts) {
  return new Promise(res => {
    const md = document.getElementById("md");
    document.getElementById("mdtxt").textContent = msg;
    const b = document.getElementById("mdbtns"); b.innerHTML = "";
    opts.concat([["Cancelar", null]]).forEach(([t, v]) => { const x = document.createElement("button"); x.className = "btn" + (v === null ? " red" : ""); x.textContent = t; x.onclick = () => { md.style.display = "none"; res(v); }; b.appendChild(x); });
    md.style.display = "flex";
  });
}
/* Janela para escolher os trajes de uma peça comum */

  document.getElementById("cktit").textContent = cmLabel(cm) || "Peça comum";
  const used = new Set(costumesOf(cm).map(c => c.id));
  list.innerHTML = S.costumes.map(c => `<label><input type="checkbox" value="${c.id}" ${used.has(c.id) ? "checked" : ""}> ${esc(c.name)}</label>`).join("");
  const boxes = () => [...list.querySelectorAll("input")];
  document.getElementById("ckall").onclick = () => boxes().forEach(b => b.checked = true);
  document.getElementById("cknone").onclick = () => boxes().forEach(b => b.checked = false);
  document.getElementById("ckcancel").onclick = () => ck.style.display = "none";
  document.getElementById("ckok").onclick = () => {
    boxes().forEach(b => {
      const c = S.costumes.find(x => x.id === b.value), has = c.items.some(i => i.cid === cm.id);
      if (b.checked && !has) c.items.push({ id: uid(), cid: cm.id });
      if (!b.checked && has) c.items = c.items.filter(i => i.cid !== cm.id);
    });
    ck.style.display = "none"; save(); toast("Trajes atualizados"); after();
  };
  ck.style.display = "flex";
}
function newCommon(src = {}) {
  const cm = { id: uid(), part: src.part || "", type: src.type || "", color: src.color || "", qty: src.qty || "", notes: src.notes || "", photo: src.photo || "" };
  S.common.push(cm); return cm;
}
/* Chave usada só na importação automática (peça + tipo + cor + quantidade) */
function itemKey(it) {
  const t = norm(it.type).replace(/^QUE /, "");
  if (!norm(it.part) || (!t && !norm(it.color))) return null;
  return [norm(it.part), t, norm(it.color), norm(it.qty)].join("|");
}
/* Cria peças comuns a partir das linhas idênticas que aparecem em 2 ou mais trajes */
function importRepeated() {
  const G = {};
  S.costumes.forEach(c => c.items.forEach(it => { if (it.cid) return; const k = itemKey(it); if (!k) return; (G[k] = G[k] || []).push([c, it]); }));
  const groups = Object.entries(G).filter(([, g]) => new Set(g.map(x => x[0].id)).size >= 2);
  if (!groups.length) { alert("Não há peças repetidas (idênticas) entre trajes para importar."); return false; }
  const txt = groups.map(([, g]) => `• ${cmLabel(g[0][1])} (${new Set(g.map(x => x[0].id)).size} trajes)`).join("\n");
  if (!confirm(`Serão criadas ${groups.length} peça(s) comum(ns), já vinculadas aos trajes:\n\n${txt}\n\nContinuar?`)) return false;
  const oldPhotos = S.photos || {};
  groups.forEach(([k, g]) => {
    const f = g[0][1];
    const cm = newCommon({ ...f, notes: "", photo: oldPhotos[k] || (g.find(x => x[1].photo) || [, {}])[1].photo || "" });
    g.forEach(([, it]) => { for (const p of ["part", "type", "color", "qty", "notes", "photo", "noShared"]) delete it[p]; it.cid = cm.id; });
  });
  save(); toast(groups.length + " peças comuns criadas"); return true;
}
/* Atualiza dados de versões anteriores */
function migrate(d) {
  if (!d.common) d.common = [];
  d.version = 3; return d;
}
function sharedIn(it, selfId) {
  if (!it.cid) return [];
  return S.costumes.filter(c => c.id !== selfId && c.items.some(x => x.cid === it.cid));
}
function thumb(src, attr) { return src ? `<img class="thumb" ${attr} src="${src}" alt="">` : `<div class="nothumb" ${attr}>+ foto</div>`; }

    tr.querySelectorAll("[data-f]").forEach(inp => {
      inp.oninput = () => { cm[inp.dataset.f] = inp.value; save(); };
      inp.onchange = () => { if (inp.dataset.f !== "notes" && inp.dataset.f !== "qty") inp.value = inp.value.toUpperCase(); cm[inp.dataset.f] = inp.value; tr.dataset.n = norm(cmLabel(cm)); save(); };
    });
    tr.querySelector("[data-ph]").onclick = () => {
      const set = p => { cm.photo = p; save(); re(); };
      cm.photo ? openPhoto(cm.photo, set, () => { if (confirm(`Remover a foto? Ela sairá de ${costumesOf(cm).length} traje(s).`)) set(""); }) : pickImg(set);
    };
    tr.querySelector("[data-ch]").onclick = () => chooseCostumes(cm, re);
    tr.querySelectorAll("[data-go]").forEach(ch => ch.onclick = () => go("#/traje/" + ch.dataset.go));
    tr.querySelector("[data-del]").onclick = async () => {
      const cs = costumesOf(cm);
      const v = cs.length ? await ask(`A peça "${cmLabel(cm) || "sem nome"}" está em ${cs.length} traje(s).`, [["Manter nos trajes como peça normal (sem vínculo)", "keep"], ["Remover também dos trajes", "drop"]]) : (confirm("Excluir esta peça comum?") ? "drop" : null);
      if (!v) return;
      S.costumes.forEach(c => { c.items = v === "drop" ? c.items.filter(i => i.cid !== cm.id) : c.items.map(i => i.cid === cm.id ? { id: i.id, part: cm.part, type: cm.type, color: cm.color, qty: cm.qty, notes: cm.notes, photo: cm.photo } : i); });
      S.common = S.common.filter(x => x !== cm); save(); re();
    };
  });
  if (focusId) { const r = document.getElementById("cm-" + focusId); if (r) { r.scrollIntoView({ block: "center" }); r.style.outline = "2px solid var(--pri)"; r.querySelector("input")?.focus(); } }
}

/* ===== ROTEAMENTO ===== */
function route() {
  const h = location.hash || "#/";
  document.querySelectorAll("[data-nav]").forEach(b => b.classList.toggle("on", h === b.dataset.nav || (b.dataset.nav === "#/comuns" && h.startsWith("#/comuns")) || (b.dataset.nav === "#/" && h.startsWith("#/traje/"))));
  window.scrollTo(0, 0);
  if (h.startsWith("#/traje/")) viewCostume(h.slice(8));
  else if (h === "#/dancarinos") viewDancers();
  else if (h === "#/pecas") viewPieces();
  else if (h === "#/backup") viewBackup();
  else if (h.startsWith("#/comuns")) viewCommon(h.split("/")[2]);
  else viewHome();
}
document.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => go(b.dataset.nav));
window.addEventListener("hashchange", route);

(async () => {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  S = await loadState();
  if (!S) { S = seedState(); save(); } else { S = migrate(S); save(); }
  route();
})();
</script>

<style>

<div id="bkDlg"><div class="box" id="bkBox"></div></div>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const bank = () => (S.bank = S.bank || []);
  const OPT = Object.assign({ enhance: true }, JSON.parse(localStorage.getItem("bancoOpc") || "{}"));

  /* 1) Processamento: fundo BRANCO (em vez de preto) + realce opcional */
  window.readImg = readImg = function (file, max = 1000) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => {
        const im = new Image();
        im.onload = () => {
          const k = Math.min(1, max / Math.max(im.width, im.height));
          const cv = document.createElement("canvas");
          cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
          const g = cv.getContext("2d");
          g.fillStyle = "#ffffff"; g.fillRect(0, 0, cv.width, cv.height);
          if (OPT.enhance) g.filter = "brightness(1.06) contrast(1.10) saturate(1.08)";
          g.drawImage(im, 0, 0, cv.width, cv.height);
          res(cv.toDataURL("image/jpeg", 0.85));
        };
        im.onerror = () => rej(new Error("Formato de imagem não suportado"));
        im.src = fr.result;
      };
      fr.onerror = rej; fr.readAsDataURL(file);
    });
  };
  async function addFiles(files) {
    let n = 0, bad = 0;
    for (const f of files) {
      if (!f.type.startsWith("image/")) { bad++; continue; }
      try { const img = await readImg(f); bank().push({ id: uid(), name: f.name.replace(/\.[^.]+$/, "").toUpperCase(), img, date: new Date().toISOString().slice(0, 10) }); n++; }
      catch (e) { bad++; }
    }
    save(); toast(n + " foto(s) adicionada(s) ao banco" + (bad ? ` · ${bad} ignorada(s)` : ""));
    if (bad) alert(bad + " arquivo(s) não puderam ser lidos. Use JPG ou PNG (fotos HEIC do iPhone não abrem em todos os navegadores).");
  }

  /* Onde cada foto do banco está sendo usada */
  function usage(b) {
    const r = [];
    S.costumes.forEach(c => {
      if (c.photo === b.img) r.push("Capa: " + c.name);
      c.items.forEach(it => { if (!it.cid && it.photo === b.img) r.push(c.name + " · " + (it.part || "peça")); });
    });
    (S.common || []).forEach(cm => { if (cm.photo === b.img) r.push("Peça comum: " + [cm.part, cm.type, cm.color].filter(Boolean).join(" ")); });
    return r;
  }

  /* 2) Janela "Usar esta foto em..." */
  function assignDlg(b) {
    const box = $("bkBox");
    const costOpts = S.costumes.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
    box.innerHTML = `<div style="display:flex;gap:14px;flex-wrap:wrap"><img src="${b.img}" style="width:180px;height:180px;object-fit:contain;background:#fff;border:1px solid #eee;border-radius:8px">
      <div style="flex:1;min-width:260px"><b>${esc(b.name)}</b>
      <label>Usar esta foto como</label>
      <select id="bkT"><option value="item">Foto de uma peça de traje</option><option value="common">Foto de uma peça comum (vale para todos os trajes marcados)</option><option value="cover">Capa de um traje</option></select>
      <div id="bkWhere"></div></div></div>
      <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn red" id="bkCancel">Cancelar</button><button class="btn on" id="bkOk">Aplicar</button></div>`;
    const where = () => {
      const t = $("bkT").value;
      if (t === "common") {
        const cs = S.common || [];
        $("bkWhere").innerHTML = cs.length ? `<label>Peça comum</label><select id="bkCm">${cs.map(cm => `<option value="${cm.id}">${esc([cm.part, cm.type, cm.color].filter(Boolean).join(" · "))}</option>`).join("")}</select>` : `<p class="warn">Nenhuma peça comum cadastrada ainda.</p>`;
      } else {
        $("bkWhere").innerHTML = `<label>Traje</label><select id="bkC">${costOpts}</select>` + (t === "item" ? `<label>Peça</label><select id="bkI"></select>` : "");
        const fill = () => {
          if (t !== "item") return;
          const c = S.costumes.find(x => x.id === $("bkC").value);
          const its = c.items.map((it, i) => [it, i]).filter(([it]) => !it.cid);
          $("bkI").innerHTML = its.length ? its.map(([it, i]) => `<option value="${i}">${esc([it.part, it.type, it.color].filter(Boolean).join(" · ") || "(sem nome)")}${it.photo ? " 📷" : ""}</option>`).join("") : `<option value="">(sem peças próprias — use peça comum)</option>`;
        };
        $("bkC").onchange = fill; fill();
      }
    };
    $("bkT").onchange = where; where();
    $("bkCancel").onclick = () => $("bkDlg").style.display = "none";
    $("bkOk").onclick = () => {
      const t = $("bkT").value; let obj = null, label = "";
      if (t === "common") { obj = (S.common || []).find(x => x.id === ($("bkCm") || {}).value); label = "peça comum"; }
      else {
        const c = S.costumes.find(x => x.id === $("bkC").value);
        if (t === "cover") { obj = c; label = "capa de " + c.name; }
        else { const i = ($("bkI") || {}).value; if (i !== "" && i != null) { obj = c.items[+i]; label = c.name; } }
      }
      if (!obj) return alert("Escolha onde usar a foto.");
      if (obj.photo && !confirm("Já existe uma foto nesse lugar. Substituir?")) return;
      obj.photo = b.img; save(); $("bkDlg").style.display = "none"; toast("Foto aplicada em " + label); viewBank();
    };
    $("bkDlg").style.display = "flex";
  }

  /* 3) Tela do banco */
  function viewBank() {
    const B = bank();
    let h = `<h2>📷 Banco de fotos</h2>
      <p class="note" style="margin-top:0">Envie várias fotos de uma vez. Elas ficam com <b>fundo branco</b>${OPT.enhance ? " e <b>realce</b> de brilho/contraste" : ""}. Depois clique em <b>Usar em...</b> para direcionar cada foto a um traje, peça ou peça comum. Você também pode escolher fotos do banco ao clicar em qualquer "+ foto".</p>
      <div id="bkDrop">Arraste as fotos para cá ou <button class="btn" id="bkUp">Escolher fotos do computador</button><br><label style="font-size:13px;display:inline-block;margin-top:8px"><input type="checkbox" id="bkEnh" ${OPT.enhance ? "checked" : ""}> Realçar as fotos ao enviar (brilho, contraste e cor)</label></div>
      <div class="bar"><input type="search" id="bkQ" placeholder="Buscar foto pelo nome..."><select id="bkF"><option value="">Todas</option><option value="free">Ainda não usadas</option><option value="used">Já usadas</option></select><span class="note">${B.length} foto(s) no banco</span></div>
      <div class="bk-grid">`;
    B.forEach((b, i) => {
      const u = usage(b);
      h += `<div class="bk-card" data-i="${i}" data-n="${esc(norm(b.name))}" data-u="${u.length ? "used" : "free"}"><img src="${b.img}" alt="" data-zoom>
        <div class="bd"><input data-nm value="${esc(b.name)}" title="Nome da foto">
        <div class="use" title="${esc(u.join("\n"))}">${u.length ? "Usada em " + u.length + ": " + esc(u.slice(0, 2).join(", ")) + (u.length > 2 ? "…" : "") : "Ainda não usada"}</div>
        <div class="row"><button class="btn" data-use>Usar em...</button><button class="btn red" data-del title="Excluir do banco">🗑</button></div></div></div>`;
    });
    app.innerHTML = h + `</div>`;
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.multiple = true;
    inp.onchange = async () => { await addFiles([...inp.files]); viewBank(); };
    $("bkUp").onclick = () => inp.click();
    $("bkEnh").onchange = e => { OPT.enhance = e.target.checked; localStorage.setItem("bancoOpc", JSON.stringify(OPT)); };
    const d = $("bkDrop");
    d.ondragover = e => { e.preventDefault(); d.classList.add("over"); };
    d.ondragleave = () => d.classList.remove("over");
    d.ondrop = async e => { e.preventDefault(); d.classList.remove("over"); await addFiles([...e.dataTransfer.files]); viewBank(); };
    const filt = () => { const q = norm($("bkQ").value), s = $("bkF").value; app.querySelectorAll(".bk-card").forEach(el => el.style.display = el.dataset.n.includes(q) && (!s || el.dataset.u === s) ? "" : "none"); };
    $("bkQ").oninput = filt; $("bkF").onchange = filt;
    app.querySelectorAll(".bk-card").forEach(el => {
      const b = B[+el.dataset.i];
      el.querySelector("[data-nm]").onchange = e => { b.name = e.target.value.toUpperCase().trim(); e.target.value = b.name; el.dataset.n = norm(b.name); save(); };
      el.querySelector("[data-zoom]").onclick = () => { $("lbimg").src = b.img; $("lb").style.display = "flex"; $("lbchg").style.display = $("lbdel").style.display = "none"; $("lbclose").onclick = () => { $("lb").style.display = "none"; $("lbchg").style.display = $("lbdel").style.display = ""; }; };
      el.querySelector("[data-use]").onclick = () => assignDlg(b);
      el.querySelector("[data-del]").onclick = () => {
        const u = usage(b);
        if (!confirm(u.length ? `Excluir do banco? A foto continua nos ${u.length} lugar(es) onde já foi aplicada.` : "Excluir esta foto do banco?")) return;
        S.bank = B.filter(x => x !== b); save(); viewBank();
      };
    });
  }

  /* 4) Ao clicar em qualquer "+ foto": escolher do banco ou enviar do computador */
  window.pickImg = pickImg = function (cb) {
    const B = bank(), box = $("bkBox");
    box.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b>Escolher foto</b>
      <span><input type="search" id="pkQ" placeholder="Buscar no banco..." style="padding:6px;border:1px solid #d9d4cc;border-radius:6px"> <button class="btn" id="pkUp">⬆ Enviar do computador</button> <button class="btn red" id="pkX">Cancelar</button></span></div>
      <div class="list"><div class="bk-grid">${B.length ? B.map((b, i) => `<div class="bk-card" data-i="${i}" data-n="${esc(norm(b.name))}" style="cursor:pointer"><img src="${b.img}" alt=""><div class="bd"><span style="font-size:12px">${esc(b.name)}</span></div></div>`).join("") : `<p class="note">O banco está vazio. Envie do computador ou use a tela 📷 Banco de fotos.</p>`}</div></div>`;
    $("bkDlg").style.display = "flex";
    const close = () => $("bkDlg").style.display = "none";
    $("pkX").onclick = close;
    $("pkQ").oninput = e => { const q = norm(e.target.value); box.querySelectorAll(".bk-card").forEach(el => el.style.display = el.dataset.n.includes(q) ? "" : "none"); };
    $("pkUp").onclick = () => {
      const i = document.createElement("input"); i.type = "file"; i.accept = "image/*";
      i.onchange = async () => { if (!i.files[0]) return; try { const img = await readImg(i.files[0]); bank().push({ id: uid(), name: i.files[0].name.replace(/\.[^.]+$/, "").toUpperCase(), img, date: new Date().toISOString().slice(0, 10) }); save(); close(); cb(img); } catch (e) { alert("Não foi possível ler esta imagem. Use JPG ou PNG."); } };
      i.click();
    };
    box.querySelectorAll(".bk-card").forEach(el => el.onclick = () => { close(); cb(B[+el.dataset.i].img); });
  };
  $("bkDlg").addEventListener("click", e => { if (e.target.id === "bkDlg") $("bkDlg").style.display = "none"; });

  /* 5) Menu e navegação */
  const btn = document.createElement("button");
  btn.className = "btn"; btn.textContent = "📷 Banco de fotos"; btn.onclick = () => go("#/banco");
  const hdr = document.querySelector("header"), ref = hdr.querySelector('[data-nav="#/backup"]');
  hdr.insertBefore(btn, ref);
  const onRoute = () => { const on = location.hash.startsWith("#/banco"); btn.classList.toggle("on", on); if (on && S) viewBank(); };
  window.addEventListener("hashchange", onRoute);
  const wait = setInterval(() => { if (S) { clearInterval(wait); onRoute(); } }, 100);
})();
</script>

<!-- ===== AJUSTE DE TEXTOS E COLUNAS ===== -->
<style>
:root{--fs:14px;--fsh:13px;--fst:22px;--fsc:14px;--fsm:14px;--padx:6px;--pady:4px;--ff:system-ui,"Segoe UI",Arial,sans-serif}

th{font-size:var(--fsh)!important}
th,td{padding:var(--pady) var(--padx)!important}

.chip,.tag,.note,.use{font-size:calc(var(--fs) - 2px)!important}
.title input{font-size:var(--fst)!important}
.nm{font-size:var(--fsc)!important}
header .btn,.bar .btn,.bar input,.bar select{font-size:var(--fsm)!important}
header h1{font-size:calc(var(--fsm) + 4px)!important}
.wrap table th{resize:horizontal;overflow:hidden;min-width:40px}
#txtPanel{position:fixed;top:56px;right:16px;background:#fff;color:#222;border-radius:10px;box-shadow:0 4px 18px #0004;padding:14px 16px;z-index:41;display:none;width:320px;max-height:82vh;overflow:auto;font-size:14px}
#txtPanel label{display:block;margin:9px 0 3px;font-weight:600;font-size:13px}
#txtPanel input[type=range],#txtPanel select{width:100%}
#txtPanel .v{float:right;font-weight:400;color:#777}
#txtPanel hr{border:none;border-top:1px solid #eee;margin:12px 0 4px}
</style>
<div id="txtPanel">
  <b>🔤 Textos e colunas</b>
  <label>Fonte</label>
  <select id="tpFf">
    <option value='system-ui,"Segoe UI",Arial,sans-serif'>Padrão do sistema</option>
    <option value="Arial,Helvetica,sans-serif">Arial</option>
    <option value="Calibri,Carlito,sans-serif">Calibri</option>
    <option value="Verdana,sans-serif">Verdana</option>
    <option value="Tahoma,sans-serif">Tahoma</option>
    <option value='"Times New Roman",serif'>Times New Roman</option>
  </select>
  <label>Texto das tabelas <span class="v" id="tpFsV"></span></label>
  <input type="range" id="tpFs" min="10" max="24" step="1">
  <label>Cabeçalho das tabelas <span class="v" id="tpFshV"></span></label>
  <input type="range" id="tpFsh" min="10" max="24" step="1">
  <label>Título do traje <span class="v" id="tpFstV"></span></label>
  <input type="range" id="tpFst" min="14" max="40" step="1">
  <label>Nomes nos cartões do menu <span class="v" id="tpFscV"></span></label>
  <input type="range" id="tpFsc" min="10" max="28" step="1">
  <label>Botões e menu <span class="v" id="tpFsmV"></span></label>
  <input type="range" id="tpFsm" min="10" max="20" step="1">
  <hr>
  <label>Espaço entre colunas <span class="v" id="tpPxV"></span></label>
  <input type="range" id="tpPx" min="0" max="30" step="1">
  <label>Espaço entre linhas <span class="v" id="tpPyV"></span></label>
  <input type="range" id="tpPy" min="0" max="20" step="1">
  <p class="note" style="margin:10px 0 0">Largura de cada coluna: arraste o <b>canto inferior direito do título da coluna</b> (◢). A largura fica salva.</p>
  <div style="margin-top:12px;display:flex;gap:6px;justify-content:space-between;flex-wrap:wrap">
    <button class="btn" id="tpReset">Padrão</button>
    <button class="btn" id="tpResetCols">Zerar larguras</button>
    <button class="btn" id="tpClose">Fechar</button>
  </div>
</div>
<script>
(function () {
  const DEF = { ff: 'system-ui,"Segoe UI",Arial,sans-serif', fs: 14, fsh: 13, fst: 22, fsc: 14, fsm: 14, px: 6, py: 4 };
  let P = Object.assign({}, DEF, JSON.parse(localStorage.getItem("textoAjuste") || "{}"));
  let W = JSON.parse(localStorage.getItem("colunasLargura") || "{}");
  const $ = id => document.getElementById(id);
  const map = { fs: "--fs", fsh: "--fsh", fst: "--fst", fsc: "--fsc", fsm: "--fsm", px: "--padx", py: "--pady" };
  const ids = { fs: "tpFs", fsh: "tpFsh", fst: "tpFst", fsc: "tpFsc", fsm: "tpFsm", px: "tpPx", py: "tpPy" };
  function apply() {
    const r = document.documentElement.style;
    r.setProperty("--ff", P.ff); $("tpFf").value = P.ff;
    for (const k in map) { r.setProperty(map[k], P[k] + "px"); $(ids[k]).value = P[k]; $(ids[k] + "V").textContent = P[k] + " px"; }
    localStorage.setItem("textoAjuste", JSON.stringify(P));
  }
  $("tpFf").onchange = e => { P.ff = e.target.value; apply(); };
  for (const k in ids) $(ids[k]).oninput = e => { P[k] = +e.target.value; apply(); };
  $("tpReset").onclick = () => { P = Object.assign({}, DEF); apply(); };
  $("tpResetCols").onclick = () => { W = {}; localStorage.setItem("colunasLargura", "{}"); document.querySelectorAll(".wrap table th").forEach(th => th.style.width = ""); toast("Larguras zeradas"); };
  $("tpClose").onclick = () => $("txtPanel").style.display = "none";

  /* Largura das colunas: salva por tela + nome da coluna */
  const screenKey = () => (location.hash.split("/")[1] || "home");
  const colKey = th => screenKey() + "|" + (th.textContent || "").trim().replace(/\s+/g, " ").slice(0, 40) + "|" + th.cellIndex;
  let saveW;
  const ro = new ResizeObserver(entries => {
    let changed = false;
    entries.forEach(en => { const th = en.target; if (th.dataset.wset !== "1") return; const w = Math.round(th.getBoundingClientRect().width); if (th.style.width && W[colKey(th)] !== w) { W[colKey(th)] = w; changed = true; } });
    if (changed) { clearTimeout(saveW); saveW = setTimeout(() => localStorage.setItem("colunasLargura", JSON.stringify(W)), 300); }
  });
  function hookTables() {
    document.querySelectorAll(".wrap table th").forEach(th => {
      if (th.dataset.wset) return;
      const w = W[colKey(th)]; if (w) th.style.width = w + "px";
      th.dataset.wset = "1";
      th.addEventListener("mouseup", () => { if (!th.style.width) return; W[colKey(th)] = Math.round(th.getBoundingClientRect().width); localStorage.setItem("colunasLargura", JSON.stringify(W)); });
      ro.observe(th);
    });
  }
  new MutationObserver(hookTables).observe(document.getElementById("app"), { childList: true, subtree: true });

  const b = document.createElement("button");
  b.className = "btn"; b.textContent = "🔤 Textos"; b.title = "Ajustar tamanho dos textos e espaço entre colunas";
  b.onclick = () => { const p = $("txtPanel"); p.style.display = p.style.display === "block" ? "none" : "block"; const f = $("fotoPanel"); if (f) f.style.display = "none"; };
  document.querySelector("header").appendChild(b);
  apply(); hookTables();
})();
</script>
<!-- ===== MODO CONSULTA COM PIN ===== -->
<style>
body.locked .acts,body.locked #addC,body.locked #addI,body.locked #addCm,body.locked #delC,body.locked #addD,body.locked #addDz,
body.locked #imp,body.locked #bkDrop,body.locked [data-ch],body.locked [data-use],body.locked [data-del],body.locked [data-mk],
body.locked #bI,body.locked #bR,body.locked #lbchg,body.locked #lbdel,body.locked .grp button,body.locked .nothumb,body.locked #logoBox .ph0{display:none!important}
body.locked td input,body.locked td textarea,body.locked .title input,body.locked .bk-card input{cursor:default}
#pinBtn.lk{background:#fff3cd;border-color:#fff3cd;color:#7a5a00;font-weight:600}
</style>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const hash = s => { let h = 5381; s = "trajes|" + s; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36); };
  const EDIT = ".acts button,#addC,#addI,#addCm,#delC,#addD,#addDz,#imp,#bkUp,#bkDrop,[data-ch],[data-use],[data-del],[data-mk],[data-dup],[data-mv],#cover,[data-ph],[data-cmph],.nothumb,#logoBox,#bI,#bR,#lbchg,#lbdel,.grp button,[data-dl],[data-dr],[data-dx]";
  const KEEP = "input[type=search],#fp,#bkF";
  let locked = false;

  function freeze() {
    if (!locked) return;
    document.querySelectorAll("#app input,#app textarea,#app select").forEach(el => {
      if (el.matches(KEEP)) return;
      if (el.tagName === "SELECT" || el.type === "checkbox" || el.type === "radio") el.disabled = true; else el.readOnly = true;
    });
  }
  function setLocked(v) {
    locked = v; document.body.classList.toggle("locked", v);
    if (v) sessionStorage.removeItem("trajesLiberado"); else sessionStorage.setItem("trajesLiberado", "1");
    drawBtn(); route();
  }
  /* Bloqueia cliques de edição no modo consulta; foto abre só para ver */
  document.addEventListener("click", e => {
    if (!locked) return;
    if (e.target.closest("#pinBtn")) return;
    const img = e.target.closest("img.thumb,.bk-card img");
    if (img) { e.preventDefault(); e.stopImmediatePropagation(); $("lbimg").src = img.src; $("lb").style.display = "flex"; $("lbclose").onclick = () => $("lb").style.display = "none"; return; }
    if (e.target.closest(EDIT)) { e.preventDefault(); e.stopImmediatePropagation(); toast("Modo consulta: clique em 🔒 para liberar a edição"); }
  }, true);
  document.addEventListener("dragover", e => { if (locked) e.preventDefault(); }, true);
  document.addEventListener("drop", e => { if (locked) { e.preventDefault(); e.stopImmediatePropagation(); } }, true);
  new MutationObserver(freeze).observe($("app"), { childList: true, subtree: true });

  const btn = document.createElement("button"); btn.id = "pinBtn"; btn.className = "btn";
  function drawBtn() {
    btn.textContent = locked ? "🔒 Somente consulta" : (S && S.pin ? "🔓 Edição liberada" : "🔓 Definir PIN");
    btn.classList.toggle("lk", locked);
    btn.title = locked ? "Digite o PIN para liberar a edição" : "Travar o app ou alterar o PIN";
  }
  function newPin() {
    const a = prompt("Crie um PIN (4 a 8 números):"); if (a === null) return false;
    if (!/^\d{4,8}$/.test(a)) { alert("O PIN deve ter de 4 a 8 números."); return false; }
    if (prompt("Digite o PIN novamente para confirmar:") !== a) { alert("Os PINs não conferem."); return false; }
    S.pin = hash(a); save(); toast("PIN salvo"); return true;
  }
  btn.onclick = async () => {
    if (locked) {
      const p = prompt("Digite o PIN para liberar a edição:"); if (p === null) return;
      if (hash(p) === S.pin) { setLocked(false); toast("Edição liberada"); } else alert("PIN incorreto.");
      return;
    }
    if (!S.pin) { if (newPin()) { setLocked(true); } return; }
    const v = await ask("Controle de edição", [["🔒 Travar agora (modo consulta)", "lock"], ["Alterar o PIN", "chg"], ["Remover o PIN (sempre editável)", "del"]]);
    if (v === "lock") setLocked(true);
    else if (v === "chg") newPin();
    else if (v === "del") { if (confirm("Remover o PIN? O app ficará sempre liberado para edição.")) { delete S.pin; save(); drawBtn(); toast("PIN removido"); } }
  };
  document.querySelector("header").appendChild(btn);

  const wait = setInterval(() => {
    if (!S) return; clearInterval(wait);
    locked = !!S.pin && !sessionStorage.getItem("trajesLiberado");
    document.body.classList.toggle("locked", locked); drawBtn(); freeze();
  }, 50);
})();
</script>
</body>
</html>
